version: '3.8'

services:
  # ==========================================================
  # Backend Instance 1 (CampusFind API Node.js Service)
  # ==========================================================
  backend1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campusfind-backend-1
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-1
      - NODE_ENV=production
      - DATABASE_URL=postgresql://neondb_owner:npg_oN4YEuV9FRkP@ep-orange-forest-b3ujohki-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - JWT_SECRET=campusfind_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:5173,http://localhost:8080
      - CLOUDINARY_CLOUD_NAME=eu0veldo
      - CLOUDINARY_API_KEY=896614893661741
      - CLOUDINARY_API_SECRET=A0l2dW4xCG_HLHBdjAlul6RaYKc
    networks:
      - campusfind-net

  # ==========================================================
  # Backend Instance 2 (CampusFind API Node.js Service)
  # ==========================================================
  backend2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campusfind-backend-2
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-2
      - NODE_ENV=production
      - DATABASE_URL=postgresql://neondb_owner:npg_oN4YEuV9FRkP@ep-orange-forest-b3ujohki-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - JWT_SECRET=campusfind_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:5173,http://localhost:8080
      - CLOUDINARY_CLOUD_NAME=eu0veldo
      - CLOUDINARY_API_KEY=896614893661741
      - CLOUDINARY_API_SECRET=A0l2dW4xCG_HLHBdjAlul6RaYKc
    networks:
      - campusfind-net

  # ==========================================================
  # Backend Instance 3 (CampusFind API Node.js Service)
  # ==========================================================
  backend3:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campusfind-backend-3
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-3
      - NODE_ENV=production
      - DATABASE_URL=postgresql://neondb_owner:npg_oN4YEuV9FRkP@ep-orange-forest-b3ujohki-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - JWT_SECRET=campusfind_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:5173,http://localhost:8080
      - CLOUDINARY_CLOUD_NAME=eu0veldo
      - CLOUDINARY_API_KEY=896614893661741
      - CLOUDINARY_API_SECRET=A0l2dW4xCG_HLHBdjAlul6RaYKc
    networks:
      - campusfind-net

  # ==========================================================
  # Nginx Load Balancer Reverse Proxy
  # ==========================================================
  nginx:
    image: nginx:alpine
    container_name: campusfind-nginx-lb
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - campusfind-net

networks:
  campusfind-net:
    driver: bridge
